name: Draw keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "boards/shields/patkb/*.keymap"
      - "boards/shields/patkb/*.dtsi"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "boards/shields/patkb/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      draw_args: '-n "444442vv 2vv44444"'
